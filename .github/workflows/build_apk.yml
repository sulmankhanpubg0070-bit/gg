name: Build Rozana Rate APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Generate Clean Android Native Project & Preserve Permissions
        run: |
          cp android/app/src/main/AndroidManifest.xml temp_manifest.xml
          cp -r android/app/src/main/res/mipmap-mdpi temp_mipmap_mdpi 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-hdpi temp_mipmap_hdpi 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-xhdpi temp_mipmap_xhdpi 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-xxhdpi temp_mipmap_xxhdpi 2>/dev/null || true
          cp -r android/app/src/main/res/mipmap-xxxhdpi temp_mipmap_xxxhdpi 2>/dev/null || true
          rm -rf android
          flutter create . --platforms=android --org com.rozanarate --project-name rozana_rate
          cp temp_manifest.xml android/app/src/main/AndroidManifest.xml
          rm temp_manifest.xml
          cp -r temp_mipmap_mdpi android/app/src/main/res/mipmap-mdpi 2>/dev/null || true
          cp -r temp_mipmap_hdpi android/app/src/main/res/mipmap-hdpi 2>/dev/null || true
          cp -r temp_mipmap_xhdpi android/app/src/main/res/mipmap-xhdpi 2>/dev/null || true
          cp -r temp_mipmap_xxhdpi android/app/src/main/res/mipmap-xxhdpi 2>/dev/null || true
          cp -r temp_mipmap_xxxhdpi android/app/src/main/res/mipmap-xxxhdpi 2>/dev/null || true
          rm -rf temp_mipmap_* 2>/dev/null || true

      - name: Restore Keystore after flutter create
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Patch build.gradle with signing config
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

          android {
              namespace = "com.rozanarate.app"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.rozanarate.app"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "rozanarate123"
                      keyAlias System.getenv("KEY_ALIAS") ?: "1"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "rozanarate123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk RozanaRate.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozanaRate-APK-Release
          path: RozanaRate.apk

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release (Direct APK Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: "Rozana Rate v${{ steps.app_version.outputs.version }}"
          body: "نیا ورژن v${{ steps.app_version.outputs.version }}: ڈاؤنلوڈ مکمل ہونے پر Install بٹن، سائننگ کنفلکٹ فکس اور نیا آئیکن شامل کیا گیا ہے۔"
          files: RozanaRate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
