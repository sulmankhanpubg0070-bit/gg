name: Build Rozana Rate APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Native Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.rozanarate --project-name rozana_rate

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk RozanaRate.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozanaRate-APK-Release
          path: RozanaRate.apk

      - name: Publish GitHub Release (Direct APK Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "Rozana Rate v1.0.1"
          body: "نیا اپڈیٹ v1.0.1: نیچے 3 فکسڈ نیویگیشن بٹنز (ریٹس، کیلکولیٹر، اپڈیٹس) شامل کر دیے گئے ہیں۔"
          files: RozanaRate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
