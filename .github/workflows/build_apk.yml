name: Build Rozana Rate APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Native Project & Preserve Permissions
        run: |
          cp android/app/src/main/AndroidManifest.xml temp_manifest.xml
          rm -rf android
          flutter create . --platforms=android --org com.rozanarate --project-name rozana_rate
          cp temp_manifest.xml android/app/src/main/AndroidManifest.xml
          rm temp_manifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk RozanaRate.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozanaRate-APK-Release
          path: RozanaRate.apk

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release (Direct APK Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: "Rozana Rate v${{ steps.app_version.outputs.version }}"
          body: "نیا ورژن v${{ steps.app_version.outputs.version }}: ایپ کی رفتار، کارکردگی اور OTA آٹو اپڈیٹ سسٹم میں مزید بہتری شامل کی گئی ہے۔"
          files: RozanaRate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
